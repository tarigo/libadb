name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS is not set here: every job runs a just recipe, and the
  # justfile exports the warning policy so local runs match.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-check

  clippy_libadb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - tokio
          - smol
          - tokio,usb
          - tokio,rusb
          - tokio,nusb,rusb
          - tokio,smol
          - smol,usb
          - smol,rusb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install libusb (rusb builds)
        if: contains(matrix.features, 'rusb')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: Install libudev (nusb builds)
        if: contains(matrix.features, 'usb') || contains(matrix.features, 'nusb')
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-libadb-${{ matrix.features }}
      - run: just clippy-one "${{ matrix.features }}"

  clippy_ffi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - usb
          - rusb
          - nusb,rusb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install libusb (rusb builds)
        if: contains(matrix.features, 'rusb')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: Install libudev (nusb builds)
        if: contains(matrix.features, 'usb') || contains(matrix.features, 'nusb')
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-ffi-${{ matrix.features }}
      - run: just clippy-ffi-one "${{ matrix.features }}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [tokio, smol, "tokio,nusb,rusb", "tokio,smol"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libusb + libudev (USB rows)
        if: contains(matrix.features, 'usb')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.features }}
      - run: just test-one "${{ matrix.features }}"

  test_ffi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", usb, rusb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libusb + libudev (USB rows)
        if: contains(matrix.features, 'usb')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-ffi-${{ matrix.features }}
      - run: just test-ffi-one "${{ matrix.features }}"

  # Line coverage over the feature set the CI tests exercise. This job
  # only measures — it builds and runs PR-controlled code, so it stays
  # read-only; publication lives in coverage_badge below, which gets the
  # write token but never checks out or executes anything from the repo.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      percent: ${{ steps.measure.outputs.percent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install just and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Measure line coverage
        id: measure
        # jq rounds to one decimal and always prints with a dot, which
        # keeps the pipeline locale-independent.
        run: |
          pct=$(just coverage-json | jq '.data[0].totals.lines.percent * 10 | round / 10')
          echo "percent=$pct" | tee -a "$GITHUB_OUTPUT"

  # On a main push, publish the percentage as shields.io endpoint JSON
  # to the single-file `badge-data` branch, which the README badge
  # reads. Serialized per repo, and skipped when main has moved on, so
  # an old run finishing late cannot overwrite a newer badge.
  coverage_badge:
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    env:
      COVERAGE: ${{ needs.coverage.outputs.percent }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the coverage badge data
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          latest=$(git ls-remote "$remote" refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "main moved on to $latest; skipping the badge for $GITHUB_SHA"
            exit 0
          fi
          case "${COVERAGE%.*}" in
            100|9?) color=brightgreen ;;
            8?)     color=green ;;
            7?)     color=yellowgreen ;;
            6?)     color=yellow ;;
            5?)     color=orange ;;
            *)      color=red ;;
          esac
          dir=$(mktemp -d)
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$COVERAGE" "$color" > "$dir/coverage.json"
          git -C "$dir" init -q -b badge-data
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" add coverage.json
          git -C "$dir" commit -qm "coverage ${COVERAGE}%"
          git -C "$dir" push -f "$remote" badge-data

  # Public-API semver conformance against the released crates.io
  # baseline: API changes must fit the version bump Cargo.toml carries.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libusb + libudev (all-features build)
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Install just and cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver
      - run: just semver

  # The hand-written C header against the Rust implementation; any
  # signature disagreement is a compile error in the header-check crate.
  ffi_header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-header
      - run: just ffi-header

  all_features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libusb + libudev
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: all-features
      # Features must be additive: every combination has to compile.
      - run: just all-features

  doc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: libadb, features: "tokio,rusb" }
          - { package: libadb, features: "smol,nusb" }
          - { package: libadb-ffi, features: "rusb" }
          - { package: libadb-ffi, features: "nusb" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libusb + libudev
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-${{ matrix.package }}-${{ matrix.features }}
      - run: just doc-one ${{ matrix.package }} "${{ matrix.features }}"

  msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: libadb, features: "tokio" }
          - { package: libadb, features: "smol" }
          - { package: libadb, features: "split" }
          - { package: libadb, features: "tokio,rusb" }
          - { package: libadb, features: "smol,nusb" }
          - { package: libadb-ffi, features: "" }
          - { package: libadb-ffi, features: "rusb" }
          - { package: libadb-ffi, features: "nusb" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - name: Install libusb (rusb builds)
        if: contains(matrix.features, 'rusb')
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config
      - name: Install libudev (nusb builds)
        if: contains(matrix.features, 'nusb')
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ matrix.package }}-${{ matrix.features }}
      - run: just msrv-one ${{ matrix.package }} "${{ matrix.features }}"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [packet_decode, shell_v2_frames, sync_parse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install just + cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}
      # A minute each: enough to catch a target that stopped building or
      # panics on the first inputs, not a substitute for a real campaign.
      - run: just fuzz ${{ matrix.target }} 60

  no_std_msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: thumbv7m-none-eabi
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-std-msrv
      # libadb is rlib-only, so checking it without runtime features
      # against a bare-metal target verifies the no_std + alloc promise.
      - run: just no-std thumbv7m-none-eabi
