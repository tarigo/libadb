[package]
name = "libadb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Low-level ADB protocol library for direct TCP and USB communication"
documentation = "https://docs.rs/libadb"
readme = "../README.md"
keywords = ["adb", "android", "usb", "no_std", "embedded"]
categories = ["embedded", "no-std", "network-programming", "hardware-support"]

[package.metadata.docs.rs]
features = ["tokio", "usb", "host-keys"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["rlib"]

[dependencies]
bytes = { version = "1", default-features = false }
embedded-io = "0.6"
embedded-io-async = "0.6"
heapless = "0.9"
log = "0.4"

# Only required by the full-duplex `split` module (the `split`
# feature, implied by every runtime feature). Kept optional so pure
# no_std builds with no such feature enabled don't drag these in.
[dependencies.async-lock]
version = "3"
optional = true
default-features = false

[dependencies.event-listener]
version = "5"
optional = true
default-features = false

[dependencies.embedded-io-adapters]
version = "0.6"
optional = true
default-features = false

[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["net", "io-util", "rt"]

[dependencies.smol]
version = "2"
optional = true

[dependencies.nusb]
version = "0.1"
optional = true

[dependencies.rusb]
version = "0.9"
optional = true

# Built-in RSA host key (the `keys` feature): generation, PKCS#8
# import/export and the ADB public-key encoding. no_std + alloc.
# `signature`, `rand_core`, `pkcs8` and `BigUint` are reached through
# `rsa`'s re-exports so their versions are pinned in one place.
[dependencies.rsa]
version = "0.9"
optional = true
default-features = false
features = ["pem"]

[dependencies.sha1]
version = "0.10"
optional = true
default-features = false
features = ["oid"]

[dependencies.base64ct]
version = "1"
optional = true
default-features = false
features = ["alloc"]

# Blinding the private-key operation needs entropy at every signature,
# but `Authenticator::sign` gets none: a key seeds this from the CSPRNG
# it was built with and draws from it instead.
[dependencies.rand_chacha]
version = "0.3"
optional = true
default-features = false

[dependencies.zeroize]
version = "1"
optional = true
default-features = false
features = ["alloc"]

[features]
default = ["tokio"]
# Full-duplex Reader/Writer support (the `split` module) with no
# bundled async runtime. Pulls in `std` for its sync primitives.
# Implied by every runtime feature below; enable it directly only for
# runtime-less consumers (e.g. `libadb-ffi`'s blocking executor).
split = ["dep:async-lock", "dep:event-listener", "event-listener/std"]
# Set by the runtimes below, never by hand: `required-features` can ask
# for a feature but not for a choice between two, so the examples —
# which work with either runtime — have nothing else to name.
runtime = []
tokio = ["split", "runtime", "dep:tokio", "dep:embedded-io-adapters", "embedded-io-adapters/tokio-1"]
smol = ["split", "runtime", "dep:smol", "dep:embedded-io-adapters", "embedded-io-adapters/futures-03"]
nusb = ["split", "dep:nusb"]
rusb = ["split", "dep:rusb"]
# Convenience alias for the default USB backend. Both backends may be
# enabled at once; pick one per call site via `transport::UsbBackend`.
usb = ["nusb"]
# Built-in RSA host key: generation, PKCS#8 import/export and the ADB
# public-key encoding. no_std + alloc; does not imply `split`/std.
keys = ["dep:rsa", "dep:sha1", "dep:base64ct", "dep:zeroize", "dep:rand_chacha"]
# Host key store on top of `keys`: reuse `~/.android/adbkey`, or
# generate and persist one. Needs `std` for the filesystem, but none of
# the `split` machinery. `rsa/getrandom` is what gives the caller an
# `OsRng` to hand the constructors.
host-keys = ["keys", "rsa/getrandom"]

[dev-dependencies]
bytes = "1"
env_logger = "0.11"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "time"] }
smol = "2"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
signature = "2"
# Seeded RNG for the one deterministic keygen test.
rand_chacha = "0.3"
tempfile = "3"
# Integration tests decode the ADB public-key blob independently.
base64ct = { version = "1", features = ["alloc"] }

# Every example authenticates, and the key comes from `host-keys`; the
# runtime is still chosen at the command line, except for the two
# bridges below. A feature row without `host-keys` skips the examples
# rather than failing, so at least one row has to carry it.
[[example]]
name = "abb"
required-features = ["host-keys", "runtime"]

[[example]]
name = "cmd"
required-features = ["host-keys", "runtime"]

[[example]]
name = "logcat"
required-features = ["host-keys", "runtime"]

[[example]]
name = "shell_v1"
required-features = ["host-keys", "runtime"]

[[example]]
name = "shell_v2"
required-features = ["host-keys", "runtime"]

[[example]]
name = "sync"
required-features = ["host-keys", "runtime"]

[[example]]
name = "track_app"
required-features = ["host-keys", "runtime"]

# These two bridge a local TCP socket, which the other examples do not;
# rather than carry a smol copy of that plumbing they stay tokio-only.
[[example]]
name = "forward"
required-features = ["tokio", "host-keys"]

[[example]]
name = "reverse"
required-features = ["tokio", "host-keys"]
