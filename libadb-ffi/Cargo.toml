[package]
name = "libadb-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C ABI for libadb"
documentation = "https://docs.rs/libadb-ffi"
readme = "../README.md"
keywords = ["adb", "android", "ffi", "c-api"]
categories = ["api-bindings", "external-ffi-bindings"]

[package.metadata.docs.rs]
features = ["usb", "pairing"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "adb"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
libadb = { path = "../libadb", version = "0.5.0", default-features = false, features = ["split", "host-keys"] }
# `std` provides `impl embedded_io::Error for std::io::Error`, needed
# by the blocking TCP transport.
embedded-io = { version = "0.6", features = ["std"] }
embedded-io-async = { version = "0.6", features = ["std"] }

[dev-dependencies]
tempfile = "3"
# The pairing test writes the device's half of the cipher out again
# rather than borrowing the crate's, so both sides agree on the key
# derivation and the nonce independently.
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"

# TCP support is always compiled in and runs on the crate's own
# blocking executor — no async runtime is linked. USB backends are
# opt-in and may both be enabled; the C ABI has a single
# `adb_connect(uri)`, so it prefers `nusb` when both are on.
[features]
default = []
nusb = ["libadb/nusb"]
rusb = ["libadb/rusb"]
usb = ["nusb"]
# `tls` lets `adb_connect` answer a wireless-debugging device's STLS
# (Android 11+) with TLS 1.3, presenting the caller's key in a
# certificate. Opt-in like the core's: it pulls in rustls and ring.
tls = ["libadb/tls"]
# `pairing` adds `adb_pair`, the `adb pair` exchange. It implies `tls`:
# the exchange runs inside a TLS session and presents the same
# certificate a connection later does.
pairing = ["tls", "libadb/pairing"]
